<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Révision bac</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1b2340;--mute:#4a5370;--line:#c9cfe0;--gold:#e0b100;--ok:#1b7f3b;--okbg:#e5f5ea;--err:#b00020;--errbg:#fde8ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121624;--card:#1d2336;--ink:#e8ebf5;--mute:#a9b1c9;--line:#3a425c;--okbg:#173525;--errbg:#3a1a22;--ok:#6fd08f;--err:#ff8a9c}}
:root[data-theme="dark"]{--bg:#121624;--card:#1d2336;--ink:#e8ebf5;--mute:#a9b1c9;--line:#3a425c;--okbg:#173525;--errbg:#3a1a22;--ok:#6fd08f;--err:#ff8a9c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 6px}
.mute{color:var(--mute)}
.carte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.btn{display:inline-block;padding:10px 16px;border:0;border-radius:8px;background:var(--ink);color:var(--card);font:600 1rem system-ui,sans-serif;cursor:pointer;text-decoration:none}
.choix{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.bonne{border-color:var(--ok);background:var(--okbg)}
.opt.fausse{border-color:var(--err);background:var(--errbg)}
.opt[disabled]{cursor:default}
.tag{font-size:.85rem;color:var(--mute)}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg)}
.barre{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.barre>div{height:100%;background:var(--gold);width:0}
</style>
</head>
<body>
<main>
  <h1>🔁 Révision bac — mes erreurs</h1>
  <p class="mute">Une fiche mélangée avec les questions de QCM que tu as ratées, toutes fiches confondues. Une question réussie ici sort de ta liste.</p>
  <div id="zone" class="carte">Chargement…</div>
</main>
<script>
(function(){
"use strict";
var API="https://script.google.com/macros/s/AKfycbwEoUjW-6yFBMTPgIItsZAgeQWitiPBlH6GVbw0-LC__bY2452rpO-5m_yfslA-EbV4dQ/exec";
var zone=document.getElementById("zone");
var code=null;try{code=localStorage.getItem("mlsCode");}catch(e){}
function appel(o){o.code=code;return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(function(r){return r.json();});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* mise en forme sûre : tout est échappé, puis seuls gras / indices / exposants sont rétablis */
function fmt(s,gabarit){
  var h=esc(s).replace(/&lt;(\/?)(sub|sup|b|i|strong|em)&gt;/gi,"<$1$2>").replace(/&lt;br\s*\/?&gt;/gi,"<br>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  if(gabarit==="p"){h=h.replace(/_\{([^}]*)\}/g,"<sub>$1</sub>").replace(/\^\{([^}]*)\}/g,"<sup>$1</sup>").replace(/_([A-Za-z0-9])/g,"<sub>$1</sub>").replace(/\^([0-9+\-−])/g,"<sup>$1</sup>");}
  return h;}
function maths(el){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(function(){});}
window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]]},svg:{fontCache:"global"}};
var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js";s.async=true;document.head.appendChild(s);

if(!code){zone.innerHTML='<p>Ouvre d’abord une fiche avec ton code d’accès : ta révision apparaîtra ensuite ici.</p><a class="btn" href="../">Voir les fiches</a>';return;}

function accueil(){
  zone.innerHTML='<p>Quelles questions veux-tu revoir ?</p><div class="choix">'+
   '<button class="btn" data-n="terminale">Terminale</button><button class="btn" data-n="premiere">Première</button><button class="btn" data-n="">Tout</button></div>';
  [].forEach.call(zone.querySelectorAll("[data-n]"),function(b){b.onclick=function(){charger(b.getAttribute("data-n"));};});
}
var Q=[],i=0,justes=0,total=0;
function charger(niv){
  zone.textContent="Préparation de ta fiche…";
  appel({action:"revision",niveau:niv}).then(function(r){
    if(!r.ok){zone.innerHTML="<p>"+esc(r.erreur||"Révision indisponible.")+'</p><a class="btn" href="../">Voir les fiches</a>';return;}
    if(!r.questions.length){zone.innerHTML='<p>🎉 Aucune question ratée en mémoire pour ce choix. Fais des QCM sur les fiches, tes erreurs apparaîtront ici.</p><a class="btn" href="../">Voir les fiches</a>';return;}
    Q=r.questions;i=0;justes=0;total=r.total;question();
  }).catch(function(){zone.textContent="Pas de connexion au serveur. Réessaie dans un instant.";});
}
function question(){
  if(i>=Q.length)return fin();
  var q=Q[i],ordre=q.o.map(function(x,k){return k;});
  for(var a=ordre.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var t=ordre[a];ordre[a]=ordre[b];ordre[b]=t;}
  zone.innerHTML='<div class="tag">Question '+(i+1)+' / '+Q.length+' · '+esc(q.titre)+'</div><div class="barre"><div style="width:'+Math.round(100*i/Q.length)+'%"></div></div>'+
    '<div style="margin-top:14px;font-weight:600">'+fmt(q.t,q.f)+'</div><div id="opts"></div><div id="fb"></div>';
  var box=document.getElementById("opts");
  ordre.forEach(function(k){var b=document.createElement("button");b.className="opt";b.type="button";b.innerHTML=fmt(q.o[k],q.f);
    b.onclick=function(){repondre(k,b);};b.setAttribute("data-k",k);box.appendChild(b);});
  maths(zone);
}
function repondre(k,btn){
  var q=Q[i],ok=(k===q.c);if(ok)justes++;
  [].forEach.call(document.querySelectorAll(".opt"),function(b){b.disabled=true;if(+b.getAttribute("data-k")===q.c)b.classList.add("bonne");});
  if(!ok)btn.classList.add("fausse");
  var fb=document.getElementById("fb");
  fb.innerHTML='<div class="fb"><b>'+(ok?"✅ Bravo, c’est juste : cette question sort de ta liste.":"❌ Pas encore : elle restera dans ta révision.")+'</b>'+(q.e?'<div style="margin-top:6px">'+fmt(q.e,q.f)+'</div>':'')+'</div><p><button class="btn" id="suite" type="button">'+(i+1<Q.length?"Question suivante":"Voir mon bilan")+'</button></p>';
  document.getElementById("suite").onclick=function(){i++;question();};
  maths(fb);
  appel({action:"reponses",fiche:q.fiche,items:[{id:q.id,ok:ok}]}).catch(function(){});
}
function fin(){
  zone.innerHTML='<h2 style="margin-top:0">Bilan : '+justes+' / '+Q.length+'</h2><p>'+(justes===Q.length?"Parfait ! ":"")+'Il te restait '+total+' question(s) ratée(s) au départ. Les questions réussies sont sorties de ta liste.</p>'+
   '<div class="choix"><button class="btn" id="encore" type="button">Nouvelle révision</button><a class="btn" href="../">Retour aux fiches</a></div>';
  document.getElementById("encore").onclick=accueil;
}
accueil();
})();
</script>
</body>
</html>
